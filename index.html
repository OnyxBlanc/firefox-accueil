<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accueil</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1a0a10 0%, #2d1020 30%, #1e0a1a 60%, #0d0510 100%);
      color: #f0d6e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 2rem;
    }

    /* ---- CLOCK ---- */
    #clock-section { text-align: center; }
    #time {
      font-size: 5rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      background: linear-gradient(90deg, #f4a0b5, #e06080, #c94070);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    #date {
      font-size: 1rem;
      font-weight: 300;
      color: #c890a8;
      margin-top: 0.4rem;
      letter-spacing: 0.15em;
      text-transform: capitalize;
    }

    /* ---- SEARCH WRAPPER ---- */
    #search-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      max-width: 540px;
    }

    #engine-tabs {
      display: flex;
      gap: 0.5rem;
      background: rgba(255,160,190,0.05);
      border: 1px solid rgba(220,100,140,0.15);
      border-radius: 50px;
      padding: 0.3rem;
      backdrop-filter: blur(8px);
    }

    .engine-tab {
      cursor: pointer;
      padding: 0.3rem 0.9rem;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      color: #a07080;
      border: none;
      background: transparent;
      transition: background 0.25s, color 0.25s, transform 0.2s;
      font-family: 'Inter', sans-serif;
    }
    .engine-tab.active {
      background: linear-gradient(90deg, #c94070, #e06080);
      color: #fff;
      transform: scale(1.05);
      box-shadow: 0 0 12px rgba(220, 80, 120, 0.4);
    }
    .engine-tab:not(.active):hover {
      color: #f4a0b5;
      background: rgba(220,80,120,0.1);
    }

    #search-form {
      display: flex;
      align-items: center;
      width: 100%;
      background: rgba(255, 180, 200, 0.07);
      border: 1px solid rgba(240, 120, 150, 0.2);
      border-radius: 50px;
      padding: 0.65rem 1.2rem;
      backdrop-filter: blur(12px);
      transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
      animation: slideUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    #search-form:focus-within {
      border-color: rgba(240, 100, 140, 0.65);
      box-shadow: 0 0 22px rgba(220, 80, 120, 0.25), 0 0 0 3px rgba(220,80,120,0.07);
      transform: scale(1.015);
    }
    #engine-icon {
      font-size: 1.1rem;
      margin-right: 0.7rem;
      display: inline-block;
    }
    #engine-icon.spin {
      animation: iconSpin 0.35s cubic-bezier(0.34,1.56,0.64,1);
    }
    @keyframes iconSpin {
      0%   { transform: rotate(-30deg) scale(0.6); opacity: 0.3; }
      100% { transform: rotate(0deg)   scale(1);   opacity: 1; }
    }
    #search-form input {
      background: transparent;
      border: none;
      outline: none;
      color: #f0d6e0;
      font-size: 1rem;
      width: 100%;
      font-family: 'Inter', sans-serif;
    }
    #search-form input::placeholder { color: #a06070; }
    #search-btn {
      background: linear-gradient(90deg, #c94070, #e06080);
      border: none;
      cursor: pointer;
      color: #fff;
      font-size: 0.85rem;
      padding: 0.45rem 1rem;
      border-radius: 50px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      letter-spacing: 0.04em;
      transition: opacity 0.2s, transform 0.2s, box-shadow 0.2s;
      white-space: nowrap;
    }
    #search-btn:hover {
      opacity: 0.88;
      transform: scale(1.04);
      box-shadow: 0 0 14px rgba(220,80,120,0.45);
    }

    /* ---- WEATHER WIDGET ---- */
    #weather-widget {
      width: 100%;
      max-width: 540px;
      background: rgba(255, 160, 190, 0.06);
      border: 1px solid rgba(220, 100, 140, 0.18);
      border-radius: 20px;
      padding: 1.1rem 1.5rem;
      backdrop-filter: blur(10px);
      animation: slideUp 0.6s 0.1s cubic-bezier(0.22, 1, 0.36, 1) both;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    #weather-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    #weather-icon {
      font-size: 2.8rem;
      line-height: 1;
      animation: floatIcon 3s ease-in-out infinite;
    }
    @keyframes floatIcon {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-5px); }
    }

    #weather-main {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    #weather-temp {
      font-size: 2rem;
      font-weight: 300;
      background: linear-gradient(90deg, #f4a0b5, #e06080);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    #weather-desc {
      font-size: 0.82rem;
      color: #c890a8;
      text-transform: capitalize;
    }
    #weather-city {
      font-size: 0.72rem;
      color: #9a6070;
      letter-spacing: 0.08em;
    }

    #weather-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.3rem;
      font-size: 0.75rem;
      color: #c890a8;
    }
    #weather-right span { display: flex; align-items: center; gap: 0.3rem; }

    #weather-loading {
      font-size: 0.82rem;
      color: #9a6070;
      font-style: italic;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    #weather-error {
      font-size: 0.8rem;
      color: #c94070;
      display: none;
    }

    /* ---- LINKS GRID ---- */
    #links {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      width: 100%;
      max-width: 540px;
    }
    .link-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 0.5rem;
      background: rgba(255, 160, 190, 0.06);
      border: 1px solid rgba(220, 100, 140, 0.15);
      border-radius: 16px;
      text-decoration: none;
      color: #e8c0d0;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      transition: background 0.25s, border-color 0.25s, transform 0.2s;
      backdrop-filter: blur(6px);
    }
    .link-card:hover {
      background: rgba(220, 80, 120, 0.15);
      border-color: rgba(240, 110, 150, 0.45);
      transform: translateY(-3px);
      color: #f4c8d8;
    }
    .link-card .icon { font-size: 1.6rem; }

    /* ---- DIVIDER ---- */
    .divider {
      width: 100%;
      max-width: 540px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(220, 100, 140, 0.3), transparent);
    }

    /* ---- QUOTE ---- */
    #quote {
      text-align: center;
      max-width: 420px;
      font-size: 0.82rem;
      color: #9a6070;
      font-style: italic;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <section id="clock-section">
    <div id="time">00:00:00</div>
    <div id="date">lundi, 1 janvier</div>
  </section>

  <!-- ANIMATED SEARCH -->
  <div id="search-wrapper">
    <div id="engine-tabs">
      <button class="engine-tab active" data-engine="google" data-icon="🔍" data-url="https://www.google.com/search?q=" data-ph="Rechercher sur Google…">Google</button>
      <button class="engine-tab" data-engine="ddg" data-icon="🦆" data-url="https://duckduckgo.com/?q=" data-ph="Rechercher sur DuckDuckGo…">DuckDuckGo</button>
      <button class="engine-tab" data-engine="yt" data-icon="▶️" data-url="https://www.youtube.com/results?search_query=" data-ph="Rechercher sur YouTube…">YouTube</button>
      <button class="engine-tab" data-engine="gh" data-icon="🐙" data-url="https://github.com/search?q=" data-ph="Rechercher sur GitHub…">GitHub</button>
    </div>
    <form id="search-form">
      <span id="engine-icon">🔍</span>
      <input id="search-input" type="text" placeholder="Rechercher sur Google…" autocomplete="off" />
      <button id="search-btn" type="submit">Chercher</button>
    </form>
  </div>

  <!-- WEATHER WIDGET -->
  <div id="weather-widget">
    <div id="weather-left">
      <div id="weather-icon">⏳</div>
      <div id="weather-main">
        <div id="weather-temp">--°C</div>
        <div id="weather-desc" id="weather-loading">Chargement…</div>
        <div id="weather-city">📍 Marseille, FR</div>
      </div>
    </div>
    <div id="weather-right">
      <span id="weather-humidity">💧 --%</span>
      <span id="weather-wind">💨 -- km/h</span>
      <span id="weather-feels">🌡️ Ressenti --°C</span>
    </div>
    <div id="weather-error">Impossible de charger la météo</div>
  </div>

  <div id="links">
    <a class="link-card" href="https://github.com" target="_blank"><span class="icon">🐙</span>GitHub</a>
    <a class="link-card" href="https://youtube.com" target="_blank"><span class="icon">▶️</span>YouTube</a>
    <a class="link-card" href="https://discord.com/app" target="_blank"><span class="icon">💬</span>Discord</a>
    <a class="link-card" href="https://www.netflix.com" target="_blank"><span class="icon">🎬</span>Netflix</a>
    <a class="link-card" href="https://open.spotify.com" target="_blank"><span class="icon">🎵</span>Spotify</a>
    <a class="link-card" href="https://mail.google.com" target="_blank"><span class="icon">📧</span>Gmail</a>
    <a class="link-card" href="https://www.twitch.tv" target="_blank"><span class="icon">🎮</span>Twitch</a>
    <a class="link-card" href="https://chatgpt.com" target="_blank"><span class="icon">🤖</span>ChatGPT</a>
  </div>

  <div class="divider"></div>
  <p id="quote">« Le seul moyen de faire du bon travail, c'est d'aimer ce qu'on fait. »</p>

  <script>
    /* ---- CLOCK ---- */
    function updateClock() {
      const now = new Date();
      document.getElementById('time').textContent =
        [now.getHours(), now.getMinutes(), now.getSeconds()]
          .map(n => String(n).padStart(2,'0')).join(':');
      document.getElementById('date').textContent =
        now.toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' });
    }
    updateClock();
    setInterval(updateClock, 1000);

    /* ---- SEARCH ENGINE ---- */
    let currentUrl = 'https://www.google.com/search?q=';

    function setEngine(tab) {
      document.querySelectorAll('.engine-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentUrl = tab.dataset.url;
      document.getElementById('search-input').placeholder = tab.dataset.ph;
      const iconEl = document.getElementById('engine-icon');
      iconEl.classList.remove('spin');
      void iconEl.offsetWidth;
      iconEl.textContent = tab.dataset.icon;
      iconEl.classList.add('spin');
    }

    document.querySelectorAll('.engine-tab').forEach(tab =>
      tab.addEventListener('click', () => setEngine(tab))
    );
    setEngine(document.querySelector('.engine-tab.active'));

    document.getElementById('search-form').addEventListener('submit', e => {
      e.preventDefault();
      const q = document.getElementById('search-input').value.trim();
      if (q) window.open(currentUrl + encodeURIComponent(q), '_blank');
    });

    /* ---- WEATHER (Open-Meteo, no API key needed) ---- */
    const WEATHER_ICONS = {
      0:'☀️', 1:'🌤️', 2:'⛅', 3:'☁️',
      45:'🌫️', 48:'🌫️',
      51:'🌦️', 53:'🌦️', 55:'🌧️',
      61:'🌧️', 63:'🌧️', 65:'🌧️',
      71:'❄️', 73:'❄️', 75:'❄️',
      80:'🌦️', 81:'🌧️', 82:'⛈️',
      95:'⛈️', 96:'⛈️', 99:'⛈️'
    };
    const WEATHER_DESC = {
      0:'Ciel dégagé', 1:'Peu nuageux', 2:'Partiellement nuageux', 3:'Couvert',
      45:'Brouillard', 48:'Brouillard givrant',
      51:'Bruine légère', 53:'Bruine', 55:'Bruine forte',
      61:'Pluie légère', 63:'Pluie', 65:'Pluie forte',
      71:'Neige légère', 73:'Neige', 75:'Neige forte',
      80:'Averses légères', 81:'Averses', 82:'Averses violentes',
      95:'Orage', 96:'Orage avec grêle', 99:'Orage violent'
    };

    async function loadWeather() {
      try {
        // Marseille coords
        const lat = 43.2965, lon = 5.3698;
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code&wind_speed_unit=kmh&timezone=Europe%2FParis`;
        const res  = await fetch(url);
        const data = await res.json();
        const c    = data.current;

        const code = c.weather_code;
        document.getElementById('weather-icon').textContent  = WEATHER_ICONS[code] ?? '🌡️';
        document.getElementById('weather-temp').textContent  = `${Math.round(c.temperature_2m)}°C`;
        document.getElementById('weather-desc').textContent  = WEATHER_DESC[code]  ?? 'Inconnu';
        document.getElementById('weather-humidity').textContent = `💧 ${c.relative_humidity_2m}%`;
        document.getElementById('weather-wind').textContent     = `💨 ${Math.round(c.wind_speed_10m)} km/h`;
        document.getElementById('weather-feels').textContent    = `🌡️ Ressenti ${Math.round(c.apparent_temperature)}°C`;
      } catch(err) {
        document.getElementById('weather-error').style.display = 'block';
        document.getElementById('weather-desc').textContent = '';
      }
    }
    loadWeather();
    // Refresh every 10 min
    setInterval(loadWeather, 600_000);
  </script>

</body>
</html>
