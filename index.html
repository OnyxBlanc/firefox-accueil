<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accueil</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #1a0a10 0%, #2d1020 30%, #1e0a1a 60%, #0d0510 100%);
      color: #f0d6e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 2rem;
    }

    /* ---- CLOCK ---- */
    #clock-section {
      text-align: center;
    }

    #time {
      font-size: 5rem;
      font-weight: 300;
      letter-spacing: 0.08em;
      background: linear-gradient(90deg, #f4a0b5, #e06080, #c94070);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      line-height: 1;
    }

    #date {
      font-size: 1rem;
      font-weight: 300;
      color: #c890a8;
      margin-top: 0.4rem;
      letter-spacing: 0.15em;
      text-transform: capitalize;
    }

    /* ---- SEARCH ---- */
    #search-form {
      display: flex;
      align-items: center;
      background: rgba(255, 180, 200, 0.08);
      border: 1px solid rgba(240, 120, 150, 0.25);
      border-radius: 50px;
      padding: 0.6rem 1.2rem;
      width: 100%;
      max-width: 520px;
      backdrop-filter: blur(10px);
      transition: border-color 0.3s;
    }

    #search-form:focus-within {
      border-color: rgba(240, 100, 140, 0.7);
      box-shadow: 0 0 18px rgba(220, 80, 120, 0.2);
    }

    #search-form input {
      background: transparent;
      border: none;
      outline: none;
      color: #f0d6e0;
      font-size: 1rem;
      width: 100%;
      font-family: 'Inter', sans-serif;
    }

    #search-form input::placeholder {
      color: #a06070;
    }

    #search-form button {
      background: none;
      border: none;
      cursor: pointer;
      color: #e07090;
      font-size: 1.1rem;
      padding-left: 0.5rem;
      transition: color 0.2s;
    }

    #search-form button:hover {
      color: #f4a0b5;
    }

    /* ---- LINKS GRID ---- */
    #links {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      width: 100%;
      max-width: 520px;
    }

    .link-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      padding: 1rem 0.5rem;
      background: rgba(255, 160, 190, 0.06);
      border: 1px solid rgba(220, 100, 140, 0.15);
      border-radius: 16px;
      text-decoration: none;
      color: #e8c0d0;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      transition: background 0.25s, border-color 0.25s, transform 0.2s;
      backdrop-filter: blur(6px);
    }

    .link-card:hover {
      background: rgba(220, 80, 120, 0.15);
      border-color: rgba(240, 110, 150, 0.45);
      transform: translateY(-3px);
      color: #f4c8d8;
    }

    .link-card .icon {
      font-size: 1.6rem;
    }

    /* ---- DIVIDER ---- */
    .divider {
      width: 100%;
      max-width: 520px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(220, 100, 140, 0.3), transparent);
    }

    /* ---- QUOTE ---- */
    #quote {
      text-align: center;
      max-width: 420px;
      font-size: 0.82rem;
      color: #9a6070;
      font-style: italic;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <section id="clock-section">
    <div id="time">00:00:00</div>
    <div id="date">lundi, 1 janvier</div>
  </section>

  <form id="search-form" action="https://www.google.com/search" method="get" target="_blank">
    <input type="text" name="q" placeholder="Rechercher sur Google…" autocomplete="off" />
    <button type="submit">🔍</button>
  </form>

  <div id="links">
    <a class="link-card" href="https://github.com" target="_blank">
      <span class="icon">🐙</span>
      GitHub
    </a>
    <a class="link-card" href="https://youtube.com" target="_blank">
      <span class="icon">▶️</span>
      YouTube
    </a>
    <a class="link-card" href="https://discord.com/app" target="_blank">
      <span class="icon">💬</span>
      Discord
    </a>
    <a class="link-card" href="https://www.netflix.com" target="_blank">
      <span class="icon">🎬</span>
      Netflix
    </a>
    <a class="link-card" href="https://open.spotify.com" target="_blank">
      <span class="icon">🎵</span>
      Spotify
    </a>
    <a class="link-card" href="https://mail.google.com" target="_blank">
      <span class="icon">📧</span>
      Gmail
    </a>
    <a class="link-card" href="https://www.twitch.tv" target="_blank">
      <span class="icon">🎮</span>
      Twitch
    </a>
    <a class="link-card" href="https://chatgpt.com" target="_blank">
      <span class="icon">🤖</span>
      ChatGPT
    </a>
  </div>

  <div class="divider"></div>

  <p id="quote">"The only way to do great work is to love what you do."</p>

  <script>
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('time').textContent = `${h}:${m}:${s}`;

      const opts = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('date').textContent = now.toLocaleDateString('fr-FR', opts);
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>

</body>
</html>
