<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accueil</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      min-height:100vh;
      font-family:'Inter',sans-serif;
      background:linear-gradient(135deg,#1a0a10 0%,#2d1020 30%,#1e0a1a 60%,#0d0510 100%);
      color:#f0d6e0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      gap:2rem;
      padding:2rem 1rem 3rem;
    }

    /* CLOCK */
    #clock-section { text-align:center; }
    #time {
      font-size:4.5rem; font-weight:300; letter-spacing:0.08em;
      background:linear-gradient(90deg,#f4a0b5,#e06080,#c94070);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      line-height:1;
    }
    #date { font-size:.95rem; font-weight:300; color:#c890a8; margin-top:.35rem; letter-spacing:.15em; text-transform:capitalize; }

    /* SEARCH */
    #search-wrapper { display:flex; flex-direction:column; align-items:center; gap:.75rem; width:100%; max-width:600px; }
    #engine-tabs {
      display:flex; gap:.5rem;
      background:rgba(255,160,190,.05); border:1px solid rgba(220,100,140,.15);
      border-radius:50px; padding:.3rem; backdrop-filter:blur(8px);
    }
    .engine-tab {
      cursor:pointer; padding:.3rem .9rem; border-radius:50px; font-size:.75rem; font-weight:600;
      letter-spacing:.06em; color:#a07080; border:none; background:transparent;
      transition:background .25s,color .25s,transform .2s; font-family:'Inter',sans-serif;
    }
    .engine-tab.active { background:linear-gradient(90deg,#c94070,#e06080); color:#fff; transform:scale(1.05); box-shadow:0 0 12px rgba(220,80,120,.4); }
    .engine-tab:not(.active):hover { color:#f4a0b5; background:rgba(220,80,120,.1); }
    #search-form {
      display:flex; align-items:center; width:100%;
      background:rgba(255,180,200,.07); border:1px solid rgba(240,120,150,.2);
      border-radius:50px; padding:.65rem 1.2rem; backdrop-filter:blur(12px);
      transition:border-color .3s,box-shadow .3s,transform .3s;
      animation:slideUp .5s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    #search-form:focus-within { border-color:rgba(240,100,140,.65); box-shadow:0 0 22px rgba(220,80,120,.25),0 0 0 3px rgba(220,80,120,.07); transform:scale(1.015); }
    #engine-icon { font-size:1.1rem; margin-right:.7rem; display:inline-block; }
    #engine-icon.spin { animation:iconSpin .35s cubic-bezier(.34,1.56,.64,1); }
    @keyframes iconSpin { 0%{transform:rotate(-30deg) scale(.6);opacity:.3} 100%{transform:rotate(0deg) scale(1);opacity:1} }
    #search-form input { background:transparent; border:none; outline:none; color:#f0d6e0; font-size:1rem; width:100%; font-family:'Inter',sans-serif; }
    #search-form input::placeholder { color:#a06070; }
    #search-btn {
      background:linear-gradient(90deg,#c94070,#e06080); border:none; cursor:pointer; color:#fff;
      font-size:.85rem; padding:.45rem 1rem; border-radius:50px; font-family:'Inter',sans-serif;
      font-weight:600; letter-spacing:.04em; transition:opacity .2s,transform .2s,box-shadow .2s; white-space:nowrap;
    }
    #search-btn:hover { opacity:.88; transform:scale(1.04); box-shadow:0 0 14px rgba(220,80,120,.45); }

    /* WEATHER */
    #weather-widget {
      width:100%; max-width:600px;
      background:rgba(255,160,190,.06); border:1px solid rgba(220,100,140,.18);
      border-radius:20px; padding:1rem 1.4rem; backdrop-filter:blur(10px);
      animation:slideUp .6s .1s cubic-bezier(.22,1,.36,1) both;
      display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap;
    }
    #weather-left { display:flex; align-items:center; gap:1rem; }
    #weather-icon { font-size:2.4rem; line-height:1; animation:floatIcon 3s ease-in-out infinite; }
    @keyframes floatIcon { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
    #weather-main { display:flex; flex-direction:column; gap:.1rem; }
    #weather-temp { font-size:1.8rem; font-weight:300; background:linear-gradient(90deg,#f4a0b5,#e06080); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; line-height:1; }
    #weather-desc { font-size:.78rem; color:#c890a8; text-transform:capitalize; }
    #weather-city { font-size:.7rem; color:#9a6070; letter-spacing:.08em; }
    #weather-right { display:flex; flex-direction:column; align-items:flex-end; gap:.25rem; font-size:.73rem; color:#c890a8; }
    #weather-right span { display:flex; align-items:center; gap:.3rem; }
    #weather-error { font-size:.8rem; color:#c94070; display:none; }

    /* MAIN LAYOUT */
    #main-panel { display:flex; gap:1.5rem; width:100%; max-width:900px; flex-wrap:wrap; }

    /* CALENDAR */
    #calendar-section {
      flex:1 1 320px;
      background:rgba(255,160,190,.05); border:1px solid rgba(220,100,140,.15);
      border-radius:20px; padding:1.2rem; backdrop-filter:blur(8px);
      animation:slideUp .5s .15s cubic-bezier(.22,1,.36,1) both;
    }
    #cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; }
    #cal-month-label { font-size:.95rem; font-weight:600; color:#f0d6e0; }
    .cal-nav {
      background:none; border:none; color:#e07090; cursor:pointer; font-size:1rem;
      padding:.2rem .5rem; border-radius:8px; transition:background .2s;
    }
    .cal-nav:hover { background:rgba(220,80,120,.15); }
    #cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:.25rem; }
    .cal-dow { text-align:center; font-size:.65rem; color:#9a6070; font-weight:600; padding-bottom:.3rem; letter-spacing:.06em; }
    .cal-day {
      aspect-ratio:1; display:flex; align-items:center; justify-content:center;
      font-size:.78rem; border-radius:8px; cursor:pointer; position:relative;
      transition:background .2s, transform .15s; color:#c890a8;
    }
    .cal-day:hover { background:rgba(220,80,120,.18); color:#f4c8d8; transform:scale(1.1); }
    .cal-day.today { background:linear-gradient(135deg,#c94070,#e06080); color:#fff; font-weight:600; box-shadow:0 0 10px rgba(220,80,120,.4); }
    .cal-day.has-event::after {
      content:''; position:absolute; bottom:3px; left:50%; transform:translateX(-50%);
      width:4px; height:4px; border-radius:50%; background:#f4a0b5;
    }
    .cal-day.other-month { color:#5a3040; }
    .cal-day.past { opacity:.5; }

    /* TASKS PANEL */
    #tasks-section {
      flex:1 1 300px;
      background:rgba(255,160,190,.05); border:1px solid rgba(220,100,140,.15);
      border-radius:20px; padding:1.2rem; backdrop-filter:blur(8px);
      display:flex; flex-direction:column; gap:.8rem;
      animation:slideUp .5s .2s cubic-bezier(.22,1,.36,1) both;
      max-height:420px;
    }
    #tasks-header { display:flex; align-items:center; justify-content:space-between; }
    #tasks-title { font-size:.95rem; font-weight:600; color:#f0d6e0; }
    #btn-add-event {
      background:linear-gradient(90deg,#c94070,#e06080); border:none; color:#fff;
      font-size:.75rem; padding:.35rem .85rem; border-radius:50px; cursor:pointer;
      font-family:'Inter',sans-serif; font-weight:600; transition:opacity .2s,transform .2s;
    }
    #btn-add-event:hover { opacity:.85; transform:scale(1.04); }
    #tasks-list { overflow-y:auto; display:flex; flex-direction:column; gap:.5rem; flex:1; }
    #tasks-list::-webkit-scrollbar { width:4px; }
    #tasks-list::-webkit-scrollbar-track { background:transparent; }
    #tasks-list::-webkit-scrollbar-thumb { background:rgba(220,80,120,.3); border-radius:4px; }

    .task-item {
      display:flex; align-items:center; gap:.6rem;
      background:rgba(255,160,190,.05); border:1px solid rgba(220,100,140,.12);
      border-radius:12px; padding:.6rem .8rem;
      transition:background .2s, border-color .2s;
      animation:fadeInPill .3s ease both;
    }
    @keyframes fadeInPill { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
    .task-item.done { opacity:.55; }
    .task-item.done .task-name { text-decoration:line-through; color:#9a6070; }
    .task-item.overdue { border-color:rgba(220,60,80,.35); }
    .task-check {
      width:16px; height:16px; border-radius:50%;
      border:2px solid rgba(220,100,140,.4); cursor:pointer; flex-shrink:0;
      transition:background .2s, border-color .2s; background:transparent;
      display:flex; align-items:center; justify-content:center; font-size:.6rem;
    }
    .task-check.checked { background:linear-gradient(135deg,#c94070,#e06080); border-color:#e06080; color:#fff; }
    .task-info { flex:1; min-width:0; }
    .task-name { font-size:.8rem; color:#e8c0d0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .task-meta { font-size:.67rem; color:#9a6070; margin-top:.1rem; }
    .task-del { background:none; border:none; color:#9a6070; cursor:pointer; font-size:.85rem; transition:color .2s; }
    .task-del:hover { color:#e06080; }
    #tasks-empty { font-size:.8rem; color:#9a6070; font-style:italic; text-align:center; padding:1rem 0; }

    /* MODAL */
    #modal-overlay {
      position:fixed; inset:0; background:rgba(10,0,8,.75); backdrop-filter:blur(6px);
      display:flex; align-items:center; justify-content:center; z-index:100;
      opacity:0; pointer-events:none; transition:opacity .25s;
    }
    #modal-overlay.open { opacity:1; pointer-events:all; }
    #modal {
      background:linear-gradient(135deg,#2d1020,#1a0a10);
      border:1px solid rgba(220,100,140,.3); border-radius:20px;
      padding:1.6rem; width:90%; max-width:400px;
      transform:translateY(20px) scale(.97); transition:transform .25s;
      box-shadow:0 20px 60px rgba(0,0,0,.6);
    }
    #modal-overlay.open #modal { transform:translateY(0) scale(1); }
    #modal h3 { font-size:1rem; font-weight:600; color:#f4a0b5; margin-bottom:1.2rem; }
    .field { display:flex; flex-direction:column; gap:.35rem; margin-bottom:.9rem; }
    .field label { font-size:.75rem; color:#c890a8; font-weight:600; letter-spacing:.06em; }
    .field input, .field select {
      background:rgba(255,160,190,.07); border:1px solid rgba(220,100,140,.2);
      border-radius:10px; padding:.55rem .9rem; color:#f0d6e0;
      font-size:.85rem; font-family:'Inter',sans-serif; outline:none;
      transition:border-color .2s;
    }
    .field input:focus, .field select:focus { border-color:rgba(240,100,140,.6); }
    .field select option { background:#2d1020; }
    #modal-row { display:flex; gap:.8rem; }
    #modal-row .field { flex:1; }
    #modal-actions { display:flex; gap:.7rem; justify-content:flex-end; margin-top:1.2rem; }
    .btn-cancel {
      background:rgba(255,160,190,.08); border:1px solid rgba(220,100,140,.2);
      color:#c890a8; font-size:.82rem; padding:.45rem 1rem; border-radius:50px;
      cursor:pointer; font-family:'Inter',sans-serif; transition:background .2s;
    }
    .btn-cancel:hover { background:rgba(220,80,120,.15); }
    .btn-save {
      background:linear-gradient(90deg,#c94070,#e06080); border:none; color:#fff;
      font-size:.82rem; padding:.45rem 1.2rem; border-radius:50px; cursor:pointer;
      font-family:'Inter',sans-serif; font-weight:600; transition:opacity .2s;
    }
    .btn-save:hover { opacity:.85; }

    /* CSV EXPORT */
    #export-btn {
      background:rgba(220,80,120,.1); border:1px solid rgba(220,100,140,.2);
      color:#c890a8; font-size:.72rem; padding:.3rem .8rem; border-radius:50px;
      cursor:pointer; font-family:'Inter',sans-serif; transition:background .2s,color .2s;
      align-self:flex-end;
    }
    #export-btn:hover { background:rgba(220,80,120,.2); color:#f4c0d0; }

    /* DIVIDER / QUOTE */
    .divider { width:100%; max-width:900px; height:1px; background:linear-gradient(90deg,transparent,rgba(220,100,140,.3),transparent); }
    #quote { text-align:center; max-width:420px; font-size:.82rem; color:#9a6070; font-style:italic; line-height:1.6; }
  </style>
</head>
<body>

  <section id="clock-section">
    <div id="time">00:00:00</div>
    <div id="date">lundi, 1 janvier</div>
  </section>

  <!-- SEARCH -->
  <div id="search-wrapper">
    <div id="engine-tabs">
      <button class="engine-tab active" data-engine="google" data-icon="🔍" data-url="https://www.google.com/search?q=" data-ph="Rechercher sur Google…">Google</button>
      <button class="engine-tab" data-engine="ddg" data-icon="🦆" data-url="https://duckduckgo.com/?q=" data-ph="Rechercher sur DuckDuckGo…">DuckDuckGo</button>
      <button class="engine-tab" data-engine="yt" data-icon="▶️" data-url="https://www.youtube.com/results?search_query=" data-ph="Rechercher sur YouTube…">YouTube</button>
      <button class="engine-tab" data-engine="gh" data-icon="🐙" data-url="https://github.com/search?q=" data-ph="Rechercher sur GitHub…">GitHub</button>
    </div>
    <form id="search-form">
      <span id="engine-icon">🔍</span>
      <input id="search-input" type="text" placeholder="Rechercher sur Google…" autocomplete="off" />
      <button id="search-btn" type="submit">Chercher</button>
    </form>
  </div>

  <!-- WEATHER -->
  <div id="weather-widget">
    <div id="weather-left">
      <div id="weather-icon">⏳</div>
      <div id="weather-main">
        <div id="weather-temp">--°C</div>
        <div id="weather-desc">Chargement…</div>
        <div id="weather-city">📍 Marseille, FR</div>
      </div>
    </div>
    <div id="weather-right">
      <span id="weather-humidity">💧 --%</span>
      <span id="weather-wind">💨 -- km/h</span>
      <span id="weather-feels">🌡️ Ressenti --°C</span>
    </div>
    <div id="weather-error">Impossible de charger la météo</div>
  </div>

  <!-- CALENDAR + TASKS -->
  <div id="main-panel">

    <!-- Calendar -->
    <div id="calendar-section">
      <div id="cal-header">
        <button class="cal-nav" id="cal-prev">‹</button>
        <span id="cal-month-label"></span>
        <button class="cal-nav" id="cal-next">›</button>
      </div>
      <div id="cal-grid"></div>
    </div>

    <!-- Tasks -->
    <div id="tasks-section">
      <div id="tasks-header">
        <span id="tasks-title">📅 Événements &amp; Tâches</span>
        <button id="btn-add-event">+ Ajouter</button>
      </div>
      <div id="tasks-list"></div>
      <div id="tasks-empty" style="display:none">Aucun événement. Clique sur + Ajouter !</div>
      <button id="export-btn">💾 Exporter CSV</button>
    </div>

  </div>

  <!-- ADD EVENT MODAL -->
  <div id="modal-overlay">
    <div id="modal">
      <h3 id="modal-title">✨ Nouvel événement</h3>
      <div class="field">
        <label>NOM</label>
        <input id="ev-name" type="text" placeholder="Ex: Cours réseaux, RDV médecin…" />
      </div>
      <div id="modal-row">
        <div class="field">
          <label>DATE DÉBUT</label>
          <input id="ev-date" type="date" />
        </div>
        <div class="field">
          <label>DURÉE (min)</label>
          <input id="ev-duration" type="number" placeholder="60" min="1" />
        </div>
      </div>
      <div class="field">
        <label>TYPE</label>
        <select id="ev-type">
          <option value="task">Tâche</option>
          <option value="event">Événement</option>
          <option value="reminder">Rappel</option>
        </select>
      </div>
      <div id="modal-actions">
        <button class="btn-cancel" id="btn-cancel">Annuler</button>
        <button class="btn-save" id="btn-save">Enregistrer</button>
      </div>
    </div>
  </div>

  <div class="divider"></div>
  <p id="quote">« Le seul moyen de faire du bon travail, c'est d'aimer ce qu'on fait. »</p>

<script>
/* ---- CLOCK ---- */
function updateClock() {
  const now = new Date();
  document.getElementById('time').textContent =
    [now.getHours(),now.getMinutes(),now.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':');
  document.getElementById('date').textContent =
    now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
}
updateClock(); setInterval(updateClock,1000);

/* ---- SEARCH ---- */
let currentUrl='https://www.google.com/search?q=';
function setEngine(tab){
  document.querySelectorAll('.engine-tab').forEach(t=>t.classList.remove('active'));
  tab.classList.add('active');
  currentUrl=tab.dataset.url;
  document.getElementById('search-input').placeholder=tab.dataset.ph;
  const ic=document.getElementById('engine-icon');
  ic.classList.remove('spin'); void ic.offsetWidth;
  ic.textContent=tab.dataset.icon; ic.classList.add('spin');
}
document.querySelectorAll('.engine-tab').forEach(t=>t.addEventListener('click',()=>setEngine(t)));
setEngine(document.querySelector('.engine-tab.active'));
document.getElementById('search-form').addEventListener('submit',e=>{
  e.preventDefault();
  const q=document.getElementById('search-input').value.trim();
  if(q) window.open(currentUrl+encodeURIComponent(q),'_blank');
});

/* ---- WEATHER ---- */
const W_ICONS={0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'❄️',73:'❄️',75:'❄️',80:'🌦️',81:'🌧️',82:'⛈️',95:'⛈️',96:'⛈️',99:'⛈️'};
const W_DESC={0:'Ciel dégagé',1:'Peu nuageux',2:'Partiellement nuageux',3:'Couvert',45:'Brouillard',48:'Brouillard givrant',51:'Bruine légère',53:'Bruine',55:'Bruine forte',61:'Pluie légère',63:'Pluie',65:'Pluie forte',71:'Neige légère',73:'Neige',75:'Neige forte',80:'Averses légères',81:'Averses',82:'Averses violentes',95:'Orage',96:'Orage avec grêle',99:'Orage violent'};
async function loadWeather(){
  try{
    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=43.2965&longitude=5.3698&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code&wind_speed_unit=kmh&timezone=Europe%2FParis');
    const d=await r.json(); const c=d.current;
    document.getElementById('weather-icon').textContent=W_ICONS[c.weather_code]??'🌡️';
    document.getElementById('weather-temp').textContent=`${Math.round(c.temperature_2m)}°C`;
    document.getElementById('weather-desc').textContent=W_DESC[c.weather_code]??'Inconnu';
    document.getElementById('weather-humidity').textContent=`💧 ${c.relative_humidity_2m}%`;
    document.getElementById('weather-wind').textContent=`💨 ${Math.round(c.wind_speed_10m)} km/h`;
    document.getElementById('weather-feels').textContent=`🌡️ Ressenti ${Math.round(c.apparent_temperature)}°C`;
  }catch{ document.getElementById('weather-error').style.display='block'; }
}
loadWeather(); setInterval(loadWeather,600_000);

/* ======== CALENDAR & TASKS ======== */
let events = JSON.parse(localStorage.getItem('nx_events')||'[]');
let calYear, calMonth;
const today = new Date();
calYear  = today.getFullYear();
calMonth = today.getMonth();

function saveEvents(){ localStorage.setItem('nx_events', JSON.stringify(events)); }

function toYMD(d){ return d.toISOString().slice(0,10); }

/* -- CALENDAR RENDER -- */
function renderCalendar(){
  const months=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  document.getElementById('cal-month-label').textContent=`${months[calMonth]} ${calYear}`;

  const grid=document.getElementById('cal-grid');
  grid.innerHTML='';
  ['Lu','Ma','Me','Je','Ve','Sa','Di'].forEach(d=>{
    const el=document.createElement('div'); el.className='cal-dow'; el.textContent=d; grid.appendChild(el);
  });

  const first=new Date(calYear,calMonth,1);
  const last =new Date(calYear,calMonth+1,0);
  const todayStr=toYMD(today);
  const eventDates=new Set(events.map(e=>e.date.slice(0,10)));

  // blank cells before 1st (Mon=0)
  let startDow=(first.getDay()+6)%7;
  for(let i=0;i<startDow;i++){
    const prev=new Date(calYear,calMonth,1-startDow+i);
    const el=document.createElement('div'); el.className='cal-day other-month';
    el.textContent=prev.getDate(); grid.appendChild(el);
  }

  for(let d=1;d<=last.getDate();d++){
    const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const el=document.createElement('div'); el.className='cal-day';
    if(dateStr===todayStr) el.classList.add('today');
    if(dateStr<todayStr)   el.classList.add('past');
    if(eventDates.has(dateStr)) el.classList.add('has-event');
    el.textContent=d;
    el.addEventListener('click',()=>openModal(dateStr));
    grid.appendChild(el);
  }
}

document.getElementById('cal-prev').addEventListener('click',()=>{
  calMonth--; if(calMonth<0){calMonth=11;calYear--;}
  renderCalendar();
});
document.getElementById('cal-next').addEventListener('click',()=>{
  calMonth++; if(calMonth>11){calMonth=0;calYear++;}
  renderCalendar();
});

/* -- TASKS RENDER -- */
const TYPE_ICON={task:'✅',event:'📅',reminder:'🔔'};
function renderTasks(){
  const list=document.getElementById('tasks-list');
  const empty=document.getElementById('tasks-empty');
  list.innerHTML='';

  // Sort: upcoming first, then done
  const sorted=[...events].sort((a,b)=>{
    if(a.done!==b.done) return a.done?1:-1;
    return a.date.localeCompare(b.date);
  });

  if(sorted.length===0){ empty.style.display='block'; return; }
  empty.style.display='none';

  sorted.forEach((ev,idx)=>{
    const realIdx=events.indexOf(ev);
    const isOverdue=!ev.done && ev.date<toYMD(today);
    const item=document.createElement('div');
    item.className='task-item'+(ev.done?' done':'')+(isOverdue?' overdue':'');

    const check=document.createElement('div');
    check.className='task-check'+(ev.done?' checked':'');
    check.textContent=ev.done?'✓':'';
    check.addEventListener('click',()=>{ events[realIdx].done=!events[realIdx].done; saveEvents(); renderTasks(); renderCalendar(); });

    const info=document.createElement('div'); info.className='task-info';
    const name=document.createElement('div'); name.className='task-name';
    name.textContent=`${TYPE_ICON[ev.type]??'📌'} ${ev.name}`;
    const meta=document.createElement('div'); meta.className='task-meta';
    const d=new Date(ev.date+'T00:00:00');
    meta.textContent=`${d.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})} · ${ev.duration} min${isOverdue?' · ⏰ Passé':''}`;
    info.appendChild(name); info.appendChild(meta);

    const del=document.createElement('button'); del.className='task-del'; del.textContent='×';
    del.addEventListener('click',()=>{ events.splice(realIdx,1); saveEvents(); renderTasks(); renderCalendar(); });

    item.appendChild(check); item.appendChild(info); item.appendChild(del);
    list.appendChild(item);
  });
}

/* -- MODAL -- */
function openModal(prefillDate=''){
  document.getElementById('ev-name').value='';
  document.getElementById('ev-date').value=prefillDate||toYMD(today);
  document.getElementById('ev-duration').value='60';
  document.getElementById('ev-type').value='task';
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('ev-name').focus();
}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); }

document.getElementById('btn-add-event').addEventListener('click',()=>openModal());
document.getElementById('btn-cancel').addEventListener('click',closeModal);
document.getElementById('modal-overlay').addEventListener('click',e=>{ if(e.target===e.currentTarget) closeModal(); });

document.getElementById('btn-save').addEventListener('click',()=>{
  const name    =document.getElementById('ev-name').value.trim();
  const date    =document.getElementById('ev-date').value;
  const duration=parseInt(document.getElementById('ev-duration').value)||60;
  const type    =document.getElementById('ev-type').value;
  if(!name||!date){ alert('Merci de renseigner le nom et la date.'); return; }
  events.push({name,date,duration,type,done:false,created:new Date().toISOString()});
  saveEvents(); renderTasks(); renderCalendar(); closeModal();
});

/* -- CSV EXPORT -- */
document.getElementById('export-btn').addEventListener('click',()=>{
  if(events.length===0){ alert('Aucun événement à exporter.'); return; }
  const header='Nom,Date,Durée (min),Type,Fait';
  const rows=events.map(e=>`"${e.name.replace(/"/g,'""')}",${e.date},${e.duration},${e.type},${e.done?'Oui':'Non'}`);
  const csv=header+'\n'+rows.join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url;
  a.download=`evenements_${toYMD(today)}.csv`;
  a.click(); URL.revokeObjectURL(url);
});

/* Init */
renderCalendar();
renderTasks();
</script>
</body>
</html>
